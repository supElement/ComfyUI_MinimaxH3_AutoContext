name: Translate Readme

on:
  push:
    branches: ['main']
    paths:
      - 'README.md'  # 只在 README.md 变化时触发，避免死循环

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 确保有写入权限
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}  # 使用你的 token
          fetch-depth: 0  

      - name: Translate with Zhipu (Free Forever)
        env:
          ZHIPU_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: |
          python << 'PYEOF'
          import requests, os, json
          
          with open('README.md', 'r', encoding='utf-8') as f:
              text = f.read()
          
          # 调用智谱 GLM-4-Flash
          resp = requests.post(
              "https://open.bigmodel.cn/api/paas/v4/chat/completions",
              headers={"Authorization": f"Bearer {os.environ['ZHIPU_KEY']}"},
              json={
                  "model": "glm-4-flash-250414",
                  "max_tokens": 32000,
                  "temperature": 0.1,
                  "messages": [
                      {
                          "role": "system", 
                          "content": "你是一个专业的技术文档翻译员。请将用户提供的中文 Markdown 内容翻译成英文。"
                      },
                      {
                          "role": "user", 
                          "content": "请将以下 Markdown 内容翻译为英文。严格遵守以下要求："
                          "1. 完整保留 Markdown 格式（标题、列表、代码块、链接等）。"
                          "2. 代码块内的注释可以翻译，但代码逻辑、变量名保持不变。"
                          "3. 保持图片链接格式 ![描述](url) 原样。"
                          "4. 不要在输出内容的开头或结尾添加 Markdown 代码块标记（如 \\`\\`\\`markdown 或 \\`\\`\\`）。"
                          "5. 不要输出任何开场白或结束语（如'以下是翻译结果'），直接输出正文。\n\n"
                          "原文内容：\n" + text
                      }
                  ]
              }
          )
          
          if resp.status_code != 200:
              print(f"HTTP错误: {resp.status_code}")
              print(f"响应内容: {resp.text}")
              exit(1)
          
          resp = resp.json()
          
          if "error" in resp:
              print(f"API错误: {resp['error']}")
              exit(1)
          
          if "choices" not in resp or len(resp["choices"]) == 0:
              print(f"响应格式异常: {resp}")
              exit(1)
          
          content = resp['choices'][0]['message']['content']
          if not content or not content.strip():
            print("翻译结果为空")
            exit(1)
            
          # 后处理：去掉模型可能错误添加的外层代码块
          content = content.strip()
          if content.startswith('```markdown'):
              content = content[11:].strip()
          elif content.startswith('```'):
              first_newline = content.find('\n')
              if first_newline != -1:
                  content = content[first_newline+1:].strip()
          if content.endswith('```'):
              content = content[:-3].strip()
          
          with open('README.en.md', 'w', encoding='utf-8') as f:
              f.write(content)
          PYEOF
          
      - name: Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.en.md
          git diff --staged --quiet || (
            git commit -m "docs: auto translate" &&
            git pull --rebase origin main &&  # 先拉取最新，避免冲突
            git push
          )
